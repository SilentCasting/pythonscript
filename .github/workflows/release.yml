# Push a tag like v1.2.0 to build ChangeImageHash.exe and publish a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Test
        run: pytest
      - name: Build exe
        run: python packaging/build_exe.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChangeImageHash.exe
          generate_release_notes: true
