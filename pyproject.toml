[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "changeimagehash"
dynamic = ["version"]
description = "Give images a new MD5/SHA-256 hash without changing how they look. Desktop app + CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SilentCasting" }]
keywords = ["md5", "sha256", "hash", "image", "png", "jpeg", "unique", "duplicate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "customtkinter>=5.2",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
changeimagehash = "changeimagehash.cli:main"

[project.gui-scripts]
changeimagehash-gui = "changeimagehash.gui:main"

[project.urls]
Homepage = "https://github.com/SilentCasting/ChangeImagehashMD5"
Issues = "https://github.com/SilentCasting/ChangeImagehashMD5/issues"
Releases = "https://github.com/SilentCasting/ChangeImagehashMD5/releases"

[tool.hatch.version]
path = "src/changeimagehash/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/changeimagehash"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
